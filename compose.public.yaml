# Modo público no PC: a API roda como em produção (CORS restrito, cookie Secure,
# configuração obrigatória), o túnel da Cloudflare fica ligado e sobem também o
# agendador de sincronização e o backup diário.
#
#   docker compose -f compose.yaml -f compose.public.yaml --profile public up -d
#
# Exige no .env.compose: POSTGRES_PASSWORD próprio (a senha de exemplo é
# recusada), CLOUDFLARE_TUNNEL_TOKEN, PUBLIC_DOMAIN e o arquivo de credencial do
# BigQuery (BIGQUERY_CREDENTIALS_FILE, padrão ./secrets/bigquery.json).
services:
  api:
    environment:
      NODE_ENV: production
      WEB_ORIGINS: https://${PUBLIC_DOMAIN:?Configure PUBLIC_DOMAIN}
  scheduler:
    environment:
      NODE_ENV: production
  cloudflared:
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Configure CLOUDFLARE_TUNNEL_TOKEN}
