name: fiscaliza-ai
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    environment:
      POSTGRES_DB: fiscaliza
      POSTGRES_USER: fiscaliza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fiscaliza -d fiscaliza']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: ${IMAGE_PREFIX:?Configure IMAGE_PREFIX}-api:${IMAGE_TAG:?Configure IMAGE_TAG}
    # Migra e troca o shell pelo Node (`exec`), para o SIGTERM chegar à API.
    command: ['sh', '-c', 'node dist/back/src/migrate.js && exec node dist/back/src/server.js']
    init: true
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
    cpus: 1.5
    environment:
      DATABASE_URL: postgres://fiscaliza:${POSTGRES_PASSWORD}@postgres:5432/fiscaliza
      NODE_ENV: production
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Configure PUBLIC_DOMAIN}
      WEB_ORIGINS: https://${PUBLIC_DOMAIN:?Configure PUBLIC_DOMAIN}
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: 172.30.97.0/24
      RIO1746_MAX_RUN_BYTES: ${RIO1746_MAX_RUN_BYTES:-500000000}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 18
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Configure CLOUDFLARE_TUNNEL_TOKEN}
    healthcheck:
      test: ['CMD', 'cloudflared', 'tunnel', '--metrics', '127.0.0.1:2000', 'ready']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
  # Sincronização agendada do 1746 e do SIURB (back/src/scheduler.ts).
  scheduler:
    image: ${IMAGE_PREFIX}-api:${IMAGE_TAG}
    command: ['node', 'dist/back/src/scheduler-cli.js']
    healthcheck:
      disable: true
    init: true
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    environment:
      DATABASE_URL: postgres://fiscaliza:${POSTGRES_PASSWORD}@postgres:5432/fiscaliza
      NODE_ENV: production
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/bigquery_credentials
      HEALTHCHECK_PING_URL: ${HEALTHCHECK_SYNC_URL:-}
      RIO1746_MAX_RUN_BYTES: ${RIO1746_MAX_RUN_BYTES:-500000000}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    secrets:
      - bigquery_credentials
    depends_on:
      api:
        condition: service_healthy
  # Cópia diária do banco e das fotos para uma pasta da VPS. Copie-a para fora
  # da máquina (veja deploy/README.md): sem isso, falha de disco perde tudo.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    entrypoint: ['sh', '/backup.sh']
    environment:
      PGHOST: postgres
      PGUSER: fiscaliza
      PGDATABASE: fiscaliza
      PGPASSWORD: ${POSTGRES_PASSWORD}
      HEALTHCHECK_PING_URL: ${HEALTHCHECK_BACKUP_URL:-}
    volumes:
      - ${RELEASE_DIR:-.}/deploy/backup.sh:/backup.sh:ro
      - uploads:/uploads:ro
      - ${BACKUP_DIR:-/opt/fiscaliza-ai/backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
secrets:
  bigquery_credentials:
    file: ${BIGQUERY_CREDENTIALS_FILE:-/opt/fiscaliza-ai/secrets/bigquery.json}
volumes:
  postgres:
  uploads:
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.97.0/24
