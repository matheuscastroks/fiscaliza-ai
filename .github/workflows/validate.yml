name: CI
on:
  push:
    branches-ignore: [main]
    tags-ignore: ['**']
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  owner:
    name: Owner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require repository owner
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          test "$REPOSITORY_ID" = '997154192'
          if [ "$ACTOR_ID" = '49662686' ]; then exit 0; fi
          # Dependabot: valida as atualizações (sem segredos e sem merge automático,
          # que continua restrito ao dono no auto-merge.yml).
          if [ "$ACTOR_ID" = '49699333' ] && [ "$EVENT_NAME" = 'push' ]; then
            case "$REF" in refs/heads/dependabot/*) exit 0 ;; esac
          fi
          test "$REF" = 'refs/heads/main'
          test "$EVENT_NAME" = 'workflow_dispatch'
          test "$ACTOR_ID" = '41898282'
  app:
    name: App
    needs: owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3001/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci --prefix front
      - name: Check Expo compatibility
        working-directory: front
        run: npx expo-doctor
      - run: npm audit --omit=dev --audit-level=high --prefix front
      - run: npm test
      - run: npm run typecheck --prefix front
      - run: npm run lint --prefix front
      - run: npm run export:android --prefix front -- --output-dir ../.validation/android-bundle --max-workers 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-js-validation
          path: .validation/android-bundle
          if-no-files-found: error
          retention-days: 7
  api:
    name: API Node ${{ matrix.node }}
    needs: owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fiscaliza_test
          POSTGRES_USER: fiscaliza
          POSTGRES_PASSWORD: validation-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fiscaliza -d fiscaliza_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://fiscaliza:validation-ci-only@localhost:5432/fiscaliza_test
      CI: true
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: back/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: node dist/back/src/migrate.js
      - run: node --test --test-concurrency=1 dist/back/test/*.test.js
      - run: node dist/back/src/openapi.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-contract-node-${{ matrix.node }}
          path: back/openapi.json
          if-no-files-found: error
          retention-days: 7
  image:
    name: Docker image
    needs: owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the API image
        run: docker build -f back/Dockerfile -t fiscaliza-api:ci .
      - name: The image boots without test sources
        run: |
          docker run --rm fiscaliza-api:ci sh -c 'test ! -d dist/back/test && test -f dist/back/src/server.js && test -f dist/back/src/scheduler-cli.js'
  automation:
    name: Automation
    needs: owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - run: node --test .github/tests/*.test.cjs
      - name: Validate workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Validate deployment configuration
        env:
          IMAGE_PREFIX: ghcr.io/example/fiscaliza-ai
          IMAGE_TAG: ${{ github.sha }}
          PUBLIC_DOMAIN: fiscalizaai.matheuscastroks.com.br
          CLOUDFLARE_TUNNEL_TOKEN: validation-only-not-a-real-token
          POSTGRES_PASSWORD: validation-only
        run: |
          bash -n deploy/deploy.sh
          sh -n deploy/backup.sh
          bash -n deploy/restore.sh
          docker run --rm -v "$PWD:/repo" -w /repo koalaman/shellcheck:v0.10.0 -S warning deploy/deploy.sh deploy/backup.sh deploy/restore.sh
          # Modo público do PC (compose.yaml + compose.public.yaml) também precisa ser válido.
          cp .env.compose.example "$RUNNER_TEMP/compose.env"
          docker compose --env-file "$RUNNER_TEMP/compose.env" -f compose.yaml -f compose.public.yaml --profile public config --quiet
          # Valida a partir do pacote que o release envia, não do checkout: um
          # arquivo montado no Compose e ausente do pacote quebraria a VPS.
          export RELEASE_DIR="$RUNNER_TEMP/release"
          mkdir -p "$RELEASE_DIR"
          tar -czf "$RUNNER_TEMP/release.tgz" -T deploy/release-files.txt
          tar -xzf "$RUNNER_TEMP/release.tgz" -C "$RELEASE_DIR"
          docker compose -f "$RELEASE_DIR/compose.production.yaml" config --quiet
          missing=0
          while IFS= read -r source; do
            case "$source" in "$RELEASE_DIR"/*) test -e "$source" || { echo "Ausente no pacote: $source"; missing=1; } ;; esac
          done < <(docker compose -f "$RELEASE_DIR/compose.production.yaml" config --format json | jq -r '.services[].volumes[]? | select(.type == "bind") | .source')
          exit "$missing"
  gate:
    name: CI gate
    needs: [owner, app, api, image, automation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: node -e 'const r=JSON.parse(process.env.RESULTS); if(r.length!==5 || r.some(x=>x!=="success")) process.exit(1);'
