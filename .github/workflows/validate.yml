name: Validate participation platform
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fiscaliza_test
          POSTGRES_USER: fiscaliza
          POSTGRES_PASSWORD: validation-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fiscaliza -d fiscaliza_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://fiscaliza:validation-ci-only@localhost:5432/fiscaliza_test
      DEMO_PASSWORD: validation-ci-only
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            municipal/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix municipal
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run migrate --prefix backend
      - run: npm test --prefix backend
      - run: npm run openapi --prefix backend
      - run: npm test --prefix municipal
      - run: npm run build --prefix municipal
      - run: npx expo export --platform web --output-dir .validation/web-export --max-workers 2
