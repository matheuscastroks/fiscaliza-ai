name: CI
on:
  push:
    branches-ignore: [main]
    tags-ignore: ['**']
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  owner:
    name: Owner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require repository owner
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          test "$REPOSITORY_ID" = '997154192'
          if [ "$ACTOR_ID" = '49662686' ]; then exit 0; fi
          test "$REF" = 'refs/heads/main'
          test "$EVENT_NAME" = 'workflow_dispatch'
          test "$ACTOR_ID" = '41898282'
  app:
    name: App
    needs: owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3001/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci --prefix front
      - run: npm audit --omit=dev --audit-level=high --prefix front
      - run: npm test
      - run: npm run typecheck --prefix front
      - run: npm run lint
      - run: npm run export:android --prefix front -- --output-dir ../.validation/android-bundle --max-workers 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-js-validation
          path: .validation/android-bundle
          if-no-files-found: error
          retention-days: 7
  api:
    name: API Node ${{ matrix.node }}
    needs: owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fiscaliza_test
          POSTGRES_USER: fiscaliza
          POSTGRES_PASSWORD: validation-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fiscaliza -d fiscaliza_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://fiscaliza:validation-ci-only@localhost:5432/fiscaliza_test
      CI: true
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: back/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: node dist/back/src/migrate.js
      - run: node --test --test-concurrency=1 dist/back/test/*.test.js
      - run: node dist/back/src/openapi.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-contract-node-${{ matrix.node }}
          path: back/openapi.json
          if-no-files-found: error
          retention-days: 7
  image:
    name: Docker image
    needs: owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the API image
        run: docker build -f back/Dockerfile -t fiscaliza-api:ci .
      - name: The image boots without test sources
        run: |
          docker run --rm fiscaliza-api:ci sh -c 'test ! -d dist/back/test && test -f dist/back/src/server.js && test -f dist/back/src/scheduler-cli.js'
  automation:
    name: Automation
    needs: owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test .github/tests/*.test.cjs
      - name: Validate workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Validate deployment configuration
        env:
          IMAGE_PREFIX: ghcr.io/example/fiscaliza-ai
          IMAGE_TAG: ${{ github.sha }}
          RELEASE_DIR: ${{ github.workspace }}
          PUBLIC_DOMAIN: fiscalizaai.matheuscastroks.com.br
          CLOUDFLARE_TUNNEL_TOKEN: validation-only-not-a-real-token
          POSTGRES_PASSWORD: validation-only
        run: |
          bash -n deploy/deploy.sh
          docker compose -f compose.production.yaml config --quiet
  gate:
    name: CI gate
    needs: [owner, app, api, image, automation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: node -e 'const r=JSON.parse(process.env.RESULTS); if(r.length!==5 || r.some(x=>x!=="success")) process.exit(1);'
