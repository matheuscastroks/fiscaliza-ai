version: 2
updates:
  - package-ecosystem: npm
    directory: /back
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '@fastify/rate-limit'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /front
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Pacotes do Expo andam juntos com o SDK: atualize com `npx expo install --fix`
    # (ou expo-upgrade), não um por um.
    groups:
      expo:
        patterns: ['expo', 'expo-*', '@expo/*', 'react-native', 'react-native-*', 'react', 'react-dom']
    ignore:
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      # React e módulos nativos são alinhados pelo expo install/upgrade.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-test-renderer'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native-async-storage/async-storage'
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /back
    schedule: { interval: weekly }
    # Node acompanha .nvmrc e a matriz de testes, sem salto automático de major.
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
