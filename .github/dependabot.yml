version: 2
updates:
  - package-ecosystem: npm
    directory: /back
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /front
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Pacotes do Expo andam juntos com o SDK: atualize com `npx expo install --fix`
    # (ou expo-upgrade), não um por um.
    groups:
      expo:
        patterns: ['expo', 'expo-*', '@expo/*', 'react-native', 'react-native-*', 'react', 'react-dom']
    ignore:
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /back
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
