x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    environment:
      POSTGRES_DB: fiscaliza
      POSTGRES_USER: fiscaliza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiscaliza-local}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - fiscaliza_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fiscaliza -d fiscaliza']
      interval: 5s
      timeout: 5s
      retries: 10
  # Aplica as migrações uma vez e sai; a API só sobe depois.
  migrate:
    build:
      context: .
      dockerfile: back/Dockerfile
    image: fiscaliza-ai-api
    command: ['node', 'dist/back/src/migrate.js']
    healthcheck:
      disable: true
    restart: 'no'
    logging: *logging
    environment: &database
      DATABASE_URL: postgres://fiscaliza:${POSTGRES_PASSWORD:-fiscaliza-local}@postgres:5432/fiscaliza
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: back/Dockerfile
    image: fiscaliza-ai-api
    init: true
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
    cpus: 1.5
    environment:
      <<: *database
      NODE_ENV: ${NODE_ENV:-development}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:8080,http://localhost:5173,http://localhost:8081,http://localhost:8082}
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: 172.30.97.0/24
    ports:
      - '${API_BIND:-127.0.0.1}:${API_PORT:-43001}:3001'
    volumes:
      - fiscaliza_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
  # Só sobem com --profile public (veja compose.public.yaml): o comando comum
  # `docker compose up` não expõe nada na internet nem fala com o BigQuery.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ['public']
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    healthcheck:
      test: ['CMD', 'cloudflared', 'tunnel', '--metrics', '127.0.0.1:2000', 'ready']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - api
  # Sincroniza o 1746 e o SIURB em horários fixos (veja back/src/scheduler.ts).
  scheduler:
    image: fiscaliza-ai-api
    profiles: ['public']
    command: ['node', 'dist/back/src/scheduler-cli.js']
    # Não escuta porta: sem o healthcheck da imagem da API.
    healthcheck:
      disable: true
    init: true
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    environment:
      <<: *database
      NODE_ENV: ${NODE_ENV:-development}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/bigquery_credentials
      HEALTHCHECK_PING_URL: ${HEALTHCHECK_SYNC_URL:-}
      RIO1746_MAX_RUN_BYTES: ${RIO1746_MAX_RUN_BYTES:-500000000}
      UPLOAD_DIR: /app/uploads
    volumes:
      - fiscaliza_uploads:/app/uploads
    secrets:
      - bigquery_credentials
    depends_on:
      migrate:
        condition: service_completed_successfully
  # Cópia diária do banco e das fotos para uma pasta do computador (BACKUP_DIR).
  backup:
    image: postgres:17-alpine
    profiles: ['public']
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    entrypoint: ['sh', '/backup.sh']
    environment:
      PGHOST: postgres
      PGUSER: fiscaliza
      PGDATABASE: fiscaliza
      PGPASSWORD: ${POSTGRES_PASSWORD:-fiscaliza-local}
      HEALTHCHECK_PING_URL: ${HEALTHCHECK_BACKUP_URL:-}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - fiscaliza_uploads:/uploads:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
  edge:
    image: caddy:2-alpine
    profiles: ['edge']
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - fiscaliza_tls:/data
    depends_on:
      - api
secrets:
  bigquery_credentials:
    file: ${BIGQUERY_CREDENTIALS_FILE:-./secrets/bigquery.json}
volumes:
  fiscaliza_postgres:
  fiscaliza_uploads:
  fiscaliza_tls:
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.97.0/24
