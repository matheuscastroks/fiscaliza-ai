services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fiscaliza
      POSTGRES_USER: fiscaliza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiscaliza-local}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - fiscaliza_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fiscaliza -d fiscaliza']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: back/Dockerfile
    environment:
      DATABASE_URL: postgres://fiscaliza:${POSTGRES_PASSWORD:-fiscaliza-local}@postgres:5432/fiscaliza
      NODE_ENV: ${NODE_ENV:-development}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:8080,http://localhost:5173,http://localhost:8081,http://localhost:8082}
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: 172.30.97.0/24
    init: true
    restart: unless-stopped
    ports:
      - '${API_BIND:-127.0.0.1}:3001:3001'
    volumes:
      - fiscaliza_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
  # Só sobe com --profile public (veja compose.public.yaml): o comando comum
  # `docker compose up` não expõe nada na internet.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ['public']
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api
  edge:
    image: caddy:2-alpine
    profiles: ['edge']
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - fiscaliza_tls:/data
    depends_on:
      - api
volumes:
  fiscaliza_postgres:
  fiscaliza_uploads:
  fiscaliza_tls:
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.97.0/24
